<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CELEBRAI · Cantata de Natal 2026 · Em breve</title>
<meta name="description" content="Cantata de Natal CELEBRAI — Uma Eternidade Feliz. O convite está sendo preparado. Volte em breve.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="CELEBRAI · Cantata de Natal 2026">
<meta property="og:description" content="Uma Eternidade Feliz. 19 de dezembro, 20h, Renascer Hall Sede Internacional (Mooca, SP). O convite está sendo preparado.">
<meta property="og:url" content="https://site-proj.github.io/celebrai/">
<meta property="og:image" content="https://site-proj.github.io/celebrai/img/og.jpg">
<link rel="icon" href="img/icone-48.png">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#cfe0f5;color:#FFF5E3;font-family:Outfit,system-ui,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;animation:zoom 22s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
/* céu mais escuro em cima para a leitura, como na abertura do site */
body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(6,28,78,.72) 0%,rgba(6,28,78,.5) 30%,rgba(6,28,78,.12) 55%,rgba(6,28,78,0) 70%,rgba(6,28,78,.35) 100%)}
main{position:relative;z-index:2;min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 22px 6vh}
.k{font:700 13px/1 Outfit,system-ui,sans-serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#FFE9B0;margin:0 0 14px}
.logo{width:min(84vw,560px);height:auto;display:block}
.s{font:700 clamp(14px,3.7vw,22px)/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#FFE9B0;margin:12px 0 0}
.card{margin-top:auto;background:rgba(7,24,45,.62);border:1px solid rgba(232,186,89,.55);border-radius:22px;padding:22px 26px;max-width:440px;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(6,28,78,.35);animation:up 1.2s .4s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font:italic 500 clamp(30px,8vw,44px)/1.05 'Cormorant Garamond',Georgia,serif;color:#FFE3A1;margin:0 0 10px}
p{font:400 15.5px/1.55 Outfit,system-ui,sans-serif;color:rgba(255,245,227,.88);margin:0}
.d{margin-top:16px;padding-top:14px;border-top:1px solid rgba(232,186,89,.3);font-weight:600;color:#FFE3A1;font-size:14.5px}
.rn{width:110px;height:auto;margin-top:18px;opacity:.9}
@media (min-width:900px){main{padding-top:7vh}.card{margin-top:auto}}
@media (prefers-reduced-motion:reduce){.bg,.card{animation:none}}
</style>
</head>
<body>
<picture><source media="(max-aspect-ratio: 1/1)" srcset="img/ceu-abertura-mobile.webp"><img class="bg" src="img/ceu-abertura.webp" alt=""></picture>
<main>
  <p class="k">Cantata de Natal</p>
  <img class="logo" src="img/logo-mark.webp" alt="CELEBRAI">
  <p class="s">Uma eternidade feliz</p>
  <div class="card">
    <h1>Em breve</h1>
    <p>O seu convite está sendo preparado com muito carinho. Volte em breve.</p>
    <p class="d">Sábado, 19 de dezembro · 20h<br>Renascer Hall Sede Internacional · Mooca, SP</p>
  </div>
  <img class="rn" src="img/renascer.webp" alt="Renascer">
</main>
</body>
</html>
